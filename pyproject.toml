[build-system]
requires = ["scikit-build-core>=0.9", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "nectar_render"
version = "0.0.1"
description = ""
readme = "README.md"
authors = [{ name = "Zachary Bork" }]

dependencies = [
    "numpy>=2.2.1",
    "pillow>=11.2.1"
]
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pybind11-stubgen>=2.5.5",
    "qimage2ndarray>=1.10.0"
]

[tool.scikit-build]
cmake.source-dir = "nectar_render/csrc"
cmake.build-type = "Release"
wheel.packages = ["nectar_render"]
build-dir = "build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
norecursedirs = [".git", ".venv", "build", "dist", "nectar_render"]


